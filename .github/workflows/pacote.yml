name: Verificar e publicar ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    name: Gerar e testar no Windows
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gerar ZIP e testar os arquivos extraidos
        run: .\criar-pacote.ps1

      - name: Guardar ZIP verificado e checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BO2-Plutonium-${{ github.sha }}
          path: |
            dist/BO2-Plutonium.zip
            dist/BO2-Plutonium.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Resumir verificacao
        run: |
          $hash = (Get-FileHash .\dist\BO2-Plutonium.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @('ZIP extraido e verificado: 13 arquivos.',
            'Testes: integridade, configuracao, interface WPF, download local, interrupcao e retomada.',
            ('SHA-256: `'+$hash+'`'),
            'Pacote disponivel nos artefatos desta execucao por 30 dias.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

  publicar:
    name: Publicar versao
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Recuperar o mesmo ZIP aprovado pelos testes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BO2-Plutonium-${{ github.sha }}
          path: dist

      - name: Conferir checksum e publicar Release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use uma tag de versao estavel, por exemplo v1.2.0.' >&2
            exit 1
          fi
          sha256sum --check BO2-Plutonium.zip.sha256
          if draft=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != 'true' ]]; then
              echo 'Esta versao ja foi publicada. Crie uma nova tag para atualizar.' >&2
              exit 1
            fi
          else
            gh release create "$TAG_NAME" --verify-tag --draft --generate-notes --title "BO2 + Plutonium $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" BO2-Plutonium.zip BO2-Plutonium.zip.sha256 --clobber
          gh release edit "$TAG_NAME" --draft=false --latest
          mkdir publicado
          gh release download "$TAG_NAME" --pattern 'BO2-Plutonium.zip*' --dir publicado
          cd publicado
          sha256sum --check ../BO2-Plutonium.zip.sha256
          cmp BO2-Plutonium.zip.sha256 ../BO2-Plutonium.zip.sha256
          echo "Versao publicada e download conferido: https://github.com/$GH_REPO/releases/tag/$TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
